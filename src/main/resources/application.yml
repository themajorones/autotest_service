spring:
  application:
    name: ats
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:ats/.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: wrapper
    username: admin
    password: admin
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope: read:user,repo,read:org
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

artifact:
  storage:
    endpoint: ${ARTIFACT_STORAGE_ENDPOINT:}
    region: ${ARTIFACT_STORAGE_REGION:us-east-1}
    access-key: ${ARTIFACT_STORAGE_ACCESS_KEY:}
    secret-key: ${ARTIFACT_STORAGE_SECRET_KEY:}
    bucket: ${ARTIFACT_STORAGE_BUCKET:ats-artifacts}
    prefix: ${ARTIFACT_STORAGE_PREFIX:}
    path-style-access: ${ARTIFACT_STORAGE_PATH_STYLE_ACCESS:true}
    create-bucket: ${ARTIFACT_STORAGE_CREATE_BUCKET:false}

security:
  encryption:
    password: ${ENCRYPTION_PASSWORD}
    salt: ${ENCRYPTION_SALT}
  jwt:
    secret: ${JWT_SECRET:change-this-jwt-secret-change-this-jwt-secret-change-this-jwt-secret}
    issuer: ${JWT_ISSUER:ats}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    login-code-ttl: ${JWT_LOGIN_CODE_TTL:PT5M}
